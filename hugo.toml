baseURL = "https://elijahr.github.io/blog/"
locale = "en-us"
title = "elijahr's notebook"
theme = "terminal"
pagination.pagerSize = 5

[markup.goldmark.renderer]
  unsafe = true

[params]
  contentTypeName = "posts"
  showMenuItems = 2
  fullWidthTheme = false
  centerTheme = false

[languages]
  [languages.en]
    label = "English"
    title = "elijahr's notebook"
    [languages.en.params]
      subtitle = "experiments, musings, scratch work"
      owner = "elijahr"
      description = "elijahr's working notebook."
      keywords = ""
      menuMore = "Show more"
      readMore = "Read more"
      readOtherPosts = "Read other posts"
      [languages.en.params.logo]
        logoText = "elijahr's notebook"
        logoHomeLink = "/blog/"

    [languages.en.menu]
      [[languages.en.menu.main]]
        identifier = "posts"
        name = "posts"
        url = "/posts"
